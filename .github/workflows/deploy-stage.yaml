name: Deploy Stage

on:
  push:
    branches:
      - stage

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      # ── 共用 ──────────────────────────────────────────────────────────
      AWS_REGION: ap-southeast-1
      IMAGE_TAG: ${{ github.sha }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # ── Storybook ─────────────────────────────────────────────────────
      STORYBOOK_OUTPUT_PATH: packages/ui/storybook-static
      S3_BUCKET_STORYBOOK: siyamap-ui-stage
      CLOUDFRONT_DISTRIBUTION_ID_STAGE_UI: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_STAGE_UI }}
      CHROMATIC_PROJECT_TOKEN_STAGE: ${{ secrets.CHROMATIC_PROJECT_TOKEN_STAGE }}

      # ── Next.js ───────────────────────────────────────────────────────
      NEXTJS_STATIC_OUTPUT_PATH: apps/web/.next/static
      NEXTJS_PUBLIC_PATH: apps/web/public
      S3_BUCKET_NEXTJS_STATIC: siyamap-static-stage
      ECR_REPO_NEXTJS: siyamap/nextjs
      LAMBDA_NAME_NEXTJS_SSR: siyamap-lambda-stage
      DATABASE_URL: ${{ secrets.DATABASE_URL_STAGE }}
      NEXT_PUBLIC_API_BASE_URL: https://stage.siyamap.com/api
      NEXT_PUBLIC_IMAGE_BASE_URL: https://cdn.siyamap.com
      NEXT_PUBLIC_OAUTH_CALLBACK_GOOGLE: /oauth/google/callback
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: 675328744936-1jnflejn1rqu2gsp2i3k422fr99ohi8i.apps.googleusercontent.com
      CLOUDFRONT_DISTRIBUTION_ID_STAGE_STATIC: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_STAGE_STATIC }}

      # ── Image Watermark Processor ─────────────────────────────────────
      ECR_REPO_IMAGE_PROCESSOR: siyamap/image-processor
      LAMBDA_NAME_IMAGE_PROCESSOR: siyamap-lambda-image-processor-stage

    steps:
      # ══════════════════════════════════════════════════════════════════
      # 模組 1：共用建置流程
      # ══════════════════════════════════════════════════════════════════
      - name: 1.1 拉取程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 1.2 設定 Node.js 版本
        uses: actions/setup-node@v4
        with:
          node-version: 20
        env:
          PNPM_STORE_PATH: ~/.pnpm-store

      - name: 1.3 安裝 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 1.4 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 1.5 建置所有套件
        run: pnpm -r build

      - name: 1.6 設定 AWS 憑證
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 1.7 登入私有 ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: 1.8 登入公有 ECR（解決 Rate Limit）
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_REGION: us-east-1 # 公有 ECR 目前只在 us-east-1 有服務
        with:
          registry-type: public

      # ══════════════════════════════════════════════════════════════════
      # 模組 2：Storybook 部署
      # ══════════════════════════════════════════════════════════════════
      - name: 2.1 上傳 Storybook 到 S3
        run: |
          aws s3 sync ${{ env.STORYBOOK_OUTPUT_PATH }}/ s3://${{ env.S3_BUCKET_STORYBOOK }} \
            --delete \
            --cache-control "no-cache"

      - name: 2.2 清除 Storybook CloudFront 快取
        if: success()
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID_STAGE_UI }} \
            --paths "/index.html" "/iframe.html"

      # - name: 2.3 部署 Storybook 到 Chromatic
      #   run: |
      #     pnpm --filter @siyamap/ui exec npx chromatic --project-token=${{ env.CHROMATIC_PROJECT_TOKEN_STAGE }} --exit-zero-on-changes

      # ══════════════════════════════════════════════════════════════════
      # 模組 3：Next.js 部署
      # ══════════════════════════════════════════════════════════════════
      - name: 3.1 建置並推送 Docker Image
        run: |
          cd apps/web
          docker build \
            --platform linux/amd64 \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NEXTJS }}:${{ env.IMAGE_TAG }} .

          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NEXTJS }}:${{ env.IMAGE_TAG }}

      - name: 3.2 更新資料庫 Schema
        run: |
          cd apps/web
          pnpm db:push

      - name: 3.3 更新 Lambda 使用新 Image
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_NAME_NEXTJS_SSR }} \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NEXTJS }}:${{ env.IMAGE_TAG }}

          aws lambda wait function-updated --function-name ${{ env.LAMBDA_NAME_NEXTJS_SSR }}

      - name: 3.4 上傳 Next.js 靜態資產到 S3
        run: |
          aws s3 sync ${{ env.NEXTJS_STATIC_OUTPUT_PATH }} s3://${{ env.S3_BUCKET_NEXTJS_STATIC }}/_next/static \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 sync ${{ env.NEXTJS_PUBLIC_PATH }} s3://${{ env.S3_BUCKET_NEXTJS_STATIC }}/public \
            --delete \
            --cache-control "public, max-age=3600" # public 檔案通常不帶 Hash，建議快取時間設短一點

      - name: 3.5 清除 Next.js CloudFront 快取
        if: success()
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID_STAGE_STATIC }} \
            --paths "/_next/static/*"

      # ══════════════════════════════════════════════════════════════════
      # 模組 4：Image Watermark Processor 部署
      # ══════════════════════════════════════════════════════════════════
      - name: 4.1 建置並推送 Docker Image
        run: |
          cd apps/image-processor
          docker build \
            --platform linux/amd64 \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_IMAGE_PROCESSOR }}:${{ env.IMAGE_TAG }} .

          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_IMAGE_PROCESSOR }}:${{ env.IMAGE_TAG }}

      - name: 4.2 更新 Lambda 使用新 Image
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_NAME_IMAGE_PROCESSOR }} \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_IMAGE_PROCESSOR }}:${{ env.IMAGE_TAG }}

          aws lambda wait function-updated --function-name ${{ env.LAMBDA_NAME_IMAGE_PROCESSOR }}
